name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*' }
    steps:
      # Actions are pinned to commits: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, json, mbstring
          ini-values: error_reporting=-1, memory_limit=512M
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer require --no-update --no-interaction "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev
      - run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies
      - run: vendor/bin/phpunit

  analyse:
    name: Larastan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, gd, json, mbstring
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer analyse -- --no-progress
